<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mutasi Dashboard ADB</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at top left,
            #172033 0,
            #090b10 40%,
            #050609 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding: 18px;
}

/* =========================================
   HEADER
========================================= */

.main-header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 22px;

    margin-bottom: 18px;

    border: 1px solid #26334d;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #101827,
            #0b101b
        );

    box-shadow:
        0 0 25px rgba(0,0,0,.5);
}

.title {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 1px;
}

.subtitle {

    color: #8995a8;

    font-size: 12px;

    margin-top: 4px;
}

.connection {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 13px;

    font-weight: bold;
}

.dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #666;

    box-shadow: 0 0 8px #666;
}

.dot.connected {

    background: #00ff88;

    box-shadow:
        0 0 8px #00ff88,
        0 0 18px #00ff88;
}

.dot.disconnected {

    background: #ff3333;

    box-shadow:
        0 0 8px #ff3333,
        0 0 18px #ff3333;
}

/* =========================================
   LAYOUT
========================================= */

.dashboard {

    display: grid;

    grid-template-columns:
        minmax(320px, 1fr)
        minmax(500px, 1.6fr);

    gap: 18px;
}

/* =========================================
   PANEL
========================================= */

.panel {

    background:
        linear-gradient(
            145deg,
            #10151f,
            #080b10
        );

    border: 1px solid #202b3e;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

.panel-header {

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    border-bottom: 1px solid #202b3e;

    background: #0d131d;

    font-weight: bold;
}

.panel-header span {

    color: #f0c75e;
}

.panel-body {

    padding: 16px;
}

/* =========================================
   BUTTON
========================================= */

button {

    border: 0;

    border-radius: 8px;

    padding: 11px 16px;

    color: white;

    background: #1c2637;

    cursor: pointer;

    font-weight: bold;

    transition: .2s;
}

button:hover {

    transform: translateY(-1px);

    background: #26344b;
}

.btn-green {

    background:
        linear-gradient(
            135deg,
            #087f4e,
            #00b56b
        );
}

.btn-blue {

    background:
        linear-gradient(
            135deg,
            #1559b8,
            #2380ff
        );
}

.btn-red {

    background:
        linear-gradient(
            135deg,
            #8b1e1e,
            #e32b2b
        );
}

.btn-copy {

    padding: 6px 10px;

    font-size: 11px;
}

/* =========================================
   CONTROL
========================================= */

.controls {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 14px;
}

.status-box {

    padding: 12px;

    border-radius: 8px;

    background: #090d14;

    border: 1px solid #1d2838;

    color: #9da8b8;

    font-size: 12px;

    margin-bottom: 14px;
}

/* =========================================
   PHONE SCREEN
========================================= */

.phone-container {

    width: 100%;

    min-height: 450px;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #030405;

    border: 1px solid #1d2634;

    border-radius: 10px;

    overflow: hidden;
}

#phoneScreen {

    max-width: 100%;

    max-height: 650px;

    display: none;

    object-fit: contain;
}

.phone-placeholder {

    text-align: center;

    color: #596476;

    padding: 30px;
}

.phone-placeholder .icon {

    font-size: 50px;

    margin-bottom: 12px;
}

/* =========================================
   OCR
========================================= */

.ocr-progress {

    width: 100%;

    height: 7px;

    background: #1b222d;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 10px;
}

#ocrProgress {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00c878,
            #00ff9d
        );

    transition: width .2s;
}

/* =========================================
   TABLE
========================================= */

.table-wrapper {

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 650px;
}

th {

    padding: 13px 12px;

    text-align: left;

    background: #121a27;

    color: #f0c75e;

    font-size: 12px;

    border-bottom: 1px solid #263247;
}

td {

    padding: 12px;

    border-bottom: 1px solid #1b2432;

    font-size: 13px;
}

tbody tr:hover {

    background: #111923;
}

.amount {

    font-weight: bold;

    color: #62e6a2;

    text-align: right;
}

.time {

    color: #8ec5ff;

    font-family: monospace;

    font-weight: bold;
}

.empty {

    text-align: center;

    color: #596476;

    padding: 30px;
}

/* =========================================
   RAW OCR
========================================= */

.raw-ocr {

    margin-top: 15px;
}

.raw-ocr textarea {

    width: 100%;

    min-height: 120px;

    resize: vertical;

    background: #06080c;

    color: #9eaabd;

    border: 1px solid #202a3a;

    border-radius: 8px;

    padding: 10px;

    font-family: monospace;

    font-size: 11px;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width: 1000px) {

    .dashboard {

        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<!-- =======================================
     HEADER
======================================= -->

<div class="main-header">

    <div>

        <div class="title">
            MUTASI DASHBOARD
        </div>

        <div class="subtitle">
            Android → ADB → Screenshot → OCR
        </div>

    </div>

    <div class="connection">

        <span
            id="connectionDot"
            class="dot">
        </span>

        <span id="connectionText">
            Mengecek HP...
        </span>

    </div>

</div>


<!-- =======================================
     DASHBOARD
======================================= -->

<div class="dashboard">


    <!-- ===================================
         PANEL KIRI
    ==================================== -->

    <div class="panel">

        <div class="panel-header">

            <span>
                LAYAR HP
            </span>

            <span
                id="deviceName"
                style="font-size:11px;color:#77849a;">
                -
            </span>

        </div>


        <div class="panel-body">


            <div class="controls">

                <button
                    class="btn-blue"
                    onclick="checkDevice()">

                    🔌 Cek HP

                </button>


                <button
                    class="btn-green"
                    onclick="takeScreenshot()">

                    📸 Screenshot

                </button>


                <button
                    onclick="startAuto()">

                    ▶ Auto

                </button>


                <button
                    class="btn-red"
                    onclick="stopAuto()">

                    ■ Stop

                </button>

            </div>


            <div class="status-box">

                <div>
                    Status:
                    <b id="status">
                        Menunggu...
                    </b>
                </div>

                <div
                    class="ocr-progress">

                    <div
                        id="ocrProgress">
                    </div>

                </div>

            </div>


            <div class="phone-container">

                <img
                    id="phoneScreen"
                    alt="Layar HP">

                <div
                    id="phonePlaceholder"
                    class="phone-placeholder">

                    <div class="icon">
                        📱
                    </div>

                    <div>
                        Layar HP belum tersedia
                    </div>

                    <small>
                        Hubungkan Android melalui USB
                    </small>

                </div>

            </div>


        </div>

    </div>


    <!-- ===================================
         PANEL KANAN
    ==================================== -->

    <div class="panel">

        <div class="panel-header">

            <span>
                TABEL DETAIL MUTASI
            </span>

            <button
                class="btn-copy"
                onclick="copyAll()">

                📋 Copy Semua

            </button>

        </div>


        <div class="panel-body">


            <div class="status-box">

                <span>
                    Hasil OCR:
                </span>

                <b id="resultStatus">
                    Belum ada data
                </b>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th style="width:120px;">
                                JAM
                            </th>

                            <th>
                                NAMA / KETERANGAN
                            </th>

                            <th style="width:180px;text-align:right;">
                                NOMINAL
                            </th>

                            <th style="width:80px;">
                                COPY
                            </th>

                        </tr>

                    </thead>


                    <tbody id="resultBody">

                        <tr>

                            <td
                                colspan="4"
                                class="empty">

                                Belum ada data mutasi.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <div class="raw-ocr">

                <div
                    style="
                    margin-bottom:7px;
                    color:#76849a;
                    font-size:11px;
                    ">

                    HASIL OCR MENTAH

                </div>

                <textarea
                    id="rawText"
                    placeholder="Hasil OCR akan muncul di sini..."
                    readonly>
                </textarea>

            </div>


        </div>

    </div>

</div>


<script>

/* =================================================
   CONFIG
================================================= */

const SCREENSHOT_INTERVAL = 5000;

let autoTimer = null;

let ocrBusy = false;

let currentRows = [];


/* =================================================
   ELEMENT
================================================= */

const statusEl =
    document.getElementById("status");

const resultStatus =
    document.getElementById("resultStatus");

const rawText =
    document.getElementById("rawText");

const phoneScreen =
    document.getElementById("phoneScreen");

const phonePlaceholder =
    document.getElementById("phonePlaceholder");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");

const deviceName =
    document.getElementById("deviceName");

const ocrProgress =
    document.getElementById("ocrProgress");


/* =================================================
   STATUS
================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


/* =================================================
   CEK DEVICE
================================================= */

async function checkDevice() {

    try {

        const response =
            await fetch(
                "/api/device?_=" +
                Date.now()
            );

        const data =
            await response.json();

        if (data.connected) {

            connectionDot.className =
                "dot connected";

            connectionText.textContent =
                "HP CONNECTED";

            if (data.devices.length) {

                deviceName.textContent =
                    data.devices[0].serial;
            }

            setStatus(
                "HP berhasil terhubung."
            );

            return true;
        }

        connectionDot.className =
            "dot disconnected";

        connectionText.textContent =
            "HP DISCONNECTED";

        deviceName.textContent = "-";

        setStatus(
            "HP belum terhubung."
        );

        return false;

    } catch (error) {

        connectionDot.className =
            "dot disconnected";

        connectionText.textContent =
            "ADB ERROR";

        setStatus(
            "Server ADB tidak dapat diakses."
        );

        return false;
    }
}


/* =================================================
   SCREENSHOT
================================================= */

async function takeScreenshot() {

    if (ocrBusy) {

        setStatus(
            "OCR sebelumnya masih berjalan..."
        );

        return;
    }


    setStatus(
        "Mengambil screenshot HP..."
    );


    try {

        const connected =
            await checkDevice();

        if (!connected) {

            return;
        }


        const response =
            await fetch(
                "/api/screenshot?_=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Gagal mengambil screenshot"
            );
        }


        const blob =
            await response.blob();


        const imageURL =
            URL.createObjectURL(blob);


        phoneScreen.src =
            imageURL;

        phoneScreen.style.display =
            "block";

        phonePlaceholder.style.display =
            "none";


        setStatus(
            "Screenshot berhasil. Memulai OCR..."
        );


        await runOCR(blob);

    } catch (error) {

        console.error(error);

        setStatus(
            "Gagal mengambil screenshot: " +
            error.message
        );
    }
}
